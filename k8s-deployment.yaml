apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-web-deployment
  labels:
    app: java-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-web-app
  template:
    metadata:
      labels:
        app: java-web-app
    spec:
      containers:
      - name: java-web-container
        #image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/java-web-app:latest
        image: 927152786893.dkr.ecr.us-east-1.amazonaws.com/java-web-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: java-web-service
spec:
  type: LoadBalancer
  selector:
    app: java-web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
